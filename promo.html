<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>たちこくコミュニティ 30秒PV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=RocknRoll+One&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1b3a;--bg:#f5f6fd;--mu:#6c6f94;--blue:#3b5bff;--pink:#ff5c8a;--yel:#ffc22e;--mint:#13c59a;--vio:#8b5cf6}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%;background:#0d0d22;overflow:hidden;font-family:'Zen Maru Gothic',sans-serif;color:var(--ink)}
.disp{font-family:'RocknRoll One','Zen Maru Gothic',sans-serif;font-weight:400}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;margin:-360px 0 0 -640px;background:var(--bg);overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(80px);animation:drift 12s ease-in-out infinite alternate}
.b1{width:520px;height:520px;left:-120px;top:-120px;background:#ffd0e0}
.b2{width:560px;height:560px;right:-160px;top:-60px;background:#c9d4ff;animation-delay:-4s}
.b3{width:520px;height:520px;left:420px;bottom:-260px;background:#bff3df;animation-delay:-8s}
@keyframes drift{to{transform:translate(60px,40px) scale(1.15)}}
.sc{position:absolute;inset:0;opacity:0;transition:opacity .5s}
.sc.on{opacity:1}
.sc.on .a{animation:up .7s cubic-bezier(.2,.9,.3,1.15) var(--d,0s) both}
.sc.on .pop{animation:pop .8s cubic-bezier(.3,1.6,.5,1) var(--d,0s) both}
@keyframes up{from{opacity:0;transform:translateY(46px) scale(.96)}}
@keyframes pop{from{opacity:0;transform:scale(.2) rotate(-30deg)}}
@keyframes press{50%{transform:scale(.9)}}
.cap{position:absolute;left:96px;top:200px;width:540px}
.cap small{display:block;font-size:28px;font-weight:700;color:var(--mu);margin-bottom:10px}
.cap h2{font-size:66px;line-height:1.35}
.hl{background:linear-gradient(transparent 64%,var(--yel) 64%);color:var(--blue)}
.mock{position:absolute;left:690px;top:80px;width:500px}
.card{background:#fff;border-radius:26px;box-shadow:0 24px 50px -30px #1b1b3a99;padding:22px}
.c{display:flex;gap:14px;background:#fff;border-radius:26px;padding:18px 22px;box-shadow:0 18px 36px -26px #1b1b3a99;margin-bottom:16px}
.c.pin{background:#fff6d6;box-shadow:0 0 0 3px var(--yel)}
.av{flex:none;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;color:#fff;font:400 22px 'RocknRoll One'}
.bd{flex:1;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:2px 9px;align-items:center}
.meta b{font-size:20px}
.meta time{font-size:14px;color:var(--mu);font-weight:700}
.bd p{font-size:20px;line-height:1.6}
.tag{font-size:13px;font-weight:700;padding:0 11px;border-radius:99px;line-height:24px;color:#fff}
.tag.fresh{background:var(--pink)}.tag.ok{background:var(--blue)}.tag.pn{background:var(--yel);color:var(--ink)}
.act span{display:inline-block;margin-top:6px;background:#eef0fb;border-radius:99px;font-weight:700;font-size:14px;padding:3px 16px}
.sc.on .act .pr{animation:press .5s ease var(--d) both}
.thread{margin-top:10px;display:flex;flex-direction:column;gap:10px}
.rp{display:flex;gap:10px;background:#f2f4ff;border-radius:18px;padding:10px 14px}
.rp .av{width:36px;height:36px;font-size:16px}
.rp p{font-size:18px}
.in{background:#f1f2fb;border-radius:14px;padding:9px 16px;font-size:18px;margin-bottom:10px;width:230px;font-weight:700}
.ta{background:#f1f2fb;border:3px solid var(--blue);border-radius:16px;padding:12px 16px;font-size:20px;min-height:110px;line-height:1.6}
.ta:empty::before{content:attr(data-ph);color:#9a9dbd}
.btn{transition:transform .15s;display:inline-block;margin-top:14px;background:var(--blue);color:#fff;border-radius:99px;padding:10px 34px;font-size:18px;box-shadow:0 10px 20px -10px var(--blue)}
.live{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border-radius:99px;padding:4px 18px;font-size:16px;font-weight:700;margin-bottom:16px}
.live i{width:10px;height:10px;border-radius:50%;background:var(--mint);animation:pl 1.6s infinite}
@keyframes pl{50%{opacity:.2}}
.nw{display:flex;gap:16px;margin-bottom:18px}
.dt{flex:none;width:84px;height:90px;border-radius:22px;background:var(--pink);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dt b{font:400 27px/1.2 'RocknRoll One'}.dt span{font-size:13px}
.chip{display:inline-block;background:var(--mint);color:#fff;border-radius:99px;font-size:13px;font-weight:700;padding:0 12px;line-height:24px}
.nw h3{font:400 24px/1.5 'RocknRoll One'}
.nw p{font-size:18px;color:var(--mu)}
.mk{position:relative;width:170px;height:170px;margin:0 auto 26px}
.mk i{position:absolute;border-radius:50%}
.mk i:nth-child(1){inset:0 24% 24% 0;background:var(--blue)}
.mk i:nth-child(2){inset:24% 0 0 24%;background:var(--pink);mix-blend-mode:multiply}
.mk i:nth-child(3){width:36%;height:36%;right:0;top:0;background:var(--yel)}
.center{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;text-align:center}
.s1 h1{font-size:84px;line-height:1.2}
.s1 p{margin-top:16px;font-size:32px;font-weight:700;color:var(--mu)}
#conf i{position:absolute;left:50%;top:44%;margin:-12px}
.sc.on #conf i{animation:burst 1.5s cubic-bezier(.1,.8,.3,1) .5s both}
@keyframes burst{from{transform:translate(0,0) scale(0)}to{transform:translate(var(--dx),var(--dy)) scale(1)}}
.s6{background:var(--ink);color:#fff;overflow:hidden}
.s6 i.sh{position:absolute}
.s6 h2{font-size:92px;line-height:1.25;position:relative}
.s6 .nm{font-size:30px;font-weight:700;color:#d4d6f7;margin-top:18px;position:relative}
.go{position:relative;align-self:center;margin-top:34px;background:var(--yel);color:var(--ink);border-radius:99px;padding:14px 44px;font-size:30px}
.s6 .sub{position:relative;margin-top:22px;font-size:20px;font-weight:700;color:#aeb1e6}
#bar{position:absolute;left:0;bottom:0;height:7px;width:0;background:linear-gradient(90deg,var(--blue),var(--pink),var(--yel),var(--mint));z-index:5}
#ov{position:absolute;inset:0;z-index:10;background:var(--ink);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center}
#ov h1{font-size:64px}
#ov p{color:#c9cbf0;font-size:22px;font-weight:700}
#play{border:0;cursor:pointer;background:var(--yel);color:var(--ink);font:400 30px 'RocknRoll One';border-radius:99px;padding:16px 56px}
#fs,#mu{position:fixed;right:12px;top:12px;z-index:20;border:0;background:#ffffff30;color:#fff;border-radius:99px;padding:6px 16px;font:700 13px 'Zen Maru Gothic';cursor:pointer}
#mu{right:94px}
</style>
</head>
<body>
<button id="mu">BGM ON</button><button id="fs">全画面</button>
<div id="stage">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="sc s1" id="s1"><div class="center">
    <div class="mk pop"><i></i><i></i><i></i></div>
    <h1 class="disp a" style="--d:.7s">たちこくコミュニティ</h1>
    <p class="a" style="--d:1.5s">だれでも、なんでも、リアルタイム。</p>
    <div id="conf"></div>
  </div></div>
  <div class="sc" id="s2">
    <div class="cap a"><small>登録も、ログインもいらない</small><h2 class="disp">だれでも、<br>なんでも<br><span class="hl">書き込める。</span></h2></div>
    <div class="mock">
      <div class="card a" style="--d:.3s"><div class="in">ゆうき</div><div class="ta" id="ta" data-ph="いま、なに考えてる？"></div><span class="btn disp" id="pb">投稿する</span></div>
      <div id="s2post" style="margin-top:20px"></div>
    </div>
  </div>
  <div class="sc" id="s3">
    <div class="cap a"><small>投稿はすぐに全員へ</small><h2 class="disp"><span class="hl">リアルタイム</span>で<br>盛り上がる。</h2></div>
    <div class="mock" id="s3m" style="top:60px"></div>
  </div>
  <div class="sc" id="s4">
    <div class="cap a"><small>コメントには</small><h2 class="disp"><span class="hl">返信</span>して<br>会話がつながる。</h2></div>
    <div class="mock" id="s4m" style="top:120px"></div>
  </div>
  <div class="sc" id="s5">
    <div class="cap a"><small>運営からの連絡は</small><h2 class="disp"><span class="hl">お知らせ</span>と<br>固定メッセージで。</h2></div>
    <div class="mock" id="s5m" style="top:110px"></div>
  </div>
  <div class="sc s6" id="s6">
    <i class="sh" style="right:-70px;top:-80px;width:340px;height:340px;border-radius:50%;background:var(--yel)"></i>
    <i class="sh" style="left:-90px;bottom:-110px;width:320px;height:320px;border-radius:50%;background:var(--pink)"></i>
    <i class="sh" style="right:130px;bottom:70px;width:150px;height:56px;border-radius:99px;background:var(--mint);transform:rotate(-24deg)"></i>
    <i class="sh" style="left:200px;top:90px;width:70px;height:70px;border-radius:50%;border:13px solid #7d92ff"></i>
    <div class="center">
      <h2 class="disp a" style="--d:.2s">さあ、書き込もう。</h2>
      <div class="nm a" style="--d:.8s">たちこくコミュニティ</div>
      <div class="go disp pop" style="--d:1.2s" id="url"></div>
      <div class="sub a" style="--d:1.8s">「たちこくナビ」もあわせてチェック！</div>
    </div>
  </div>
  <div id="bar"></div>
  <div id="ov"><h1 class="disp">たちこくコミュニティ</h1><p>30秒でわかる、みんなの広場（音が出ます）</p><button id="play">▶ 再生</button></div>
</div>

<script>
// ▼ 最後の画面に表示するURL（実際のサイトのURLに書き換えてください）
const SITE_URL = 'sirius-tool.github.io/tk-community';

const $ = s => document.querySelector(s);
const COL = ['#3b5bff', '#ff5c8a', '#f5a300', '#13b98a', '#8b5cf6', '#ff7a3d'];
const tg = (k, t) => `<span class="tag ${k}">${t}</span>`;
const NEW = tg('fresh', '新規'), OK = tg('ok', '✓ 認証済み'), PIN = tg('pn', '固定中');
const card = (n, ci, body, tags = '', tm = 'たった今', d = 0, cls = '') =>
  `<div class="c a ${cls}" style="--d:${d}s"><div class="av" style="background:${COL[ci]}">${n[0]}</div><div class="bd"><div class="meta"><b>${n}</b>${tags}<time>${tm}</time></div><p>${body}</p></div></div>`;
const POST = '今日の部活おつかれ！みんなで打ち上げ行こうよ';

$('#url').textContent = SITE_URL;
$('#s2post').innerHTML = card('ゆうき', 0, POST, NEW, 'たった今', 3.9);
$('#s3m').innerHTML = `<div class="live a"><i></i>リアルタイム接続中</div>` +
  card('さくら', 1, '文化祭のクラスTシャツ、色どうする？', NEW, 'たった今', .5) +
  card('けんた', 4, '昨日の数学の宿題、むずくなかった？', NEW, 'たった今', 1.6) +
  card('ももこ', 3, '放課後、図書室でいっしょに勉強しよ〜', NEW, 'たった今', 2.7) +
  card('はると', 2, 'おすすめの本ある人おしえて！', NEW, 'たった今', 3.8);
const rp = (n, ci, t, d) => `<div class="rp a" style="--d:${d}s"><div class="av" style="background:${COL[ci]}">${n[0]}</div><div><b>${n}</b><p>${t}</p></div></div>`;
$('#s4m').innerHTML = `<div class="c a" style="--d:.3s;display:block"><div style="display:flex;gap:14px"><div class="av" style="background:${COL[1]}">さ</div><div class="bd"><div class="meta"><b>さくら</b>${NEW}<time>たった今</time></div><p>文化祭のクラスTシャツ、色どうする？</p><div class="act"><span class="pr" style="--d:.9s">↩ 返信（3）</span></div></div></div><div class="thread">${rp('ももこ', 3, 'ミントグリーンがいい！', 1.3)}${rp('けんた', 4, 'さんせい！かわいい', 2.5)}${rp('さくら', 1, 'じゃあ決まり！ありがとう', 3.7)}</div></div>`;
$('#s5m').innerHTML = `<div class="card nw a" style="--d:.4s"><div class="dt"><b>12.01</b><span>2026</span></div><div><span class="chip">最新</span><h3>冬のイベントの日程が決まりました</h3><p>くわしくは、あらためてお知らせします。</p></div></div>` +
  card('運営', 5, 'ルールを守って、みんなで楽しく使おう！', OK + PIN, '固定', 1.8, 'pin');

// 紙吹雪
function conf() {
  let h = '';
  for (let i = 0; i < 28; i++) {
    const a = Math.random() * 6.283, r = 260 + Math.random() * 340, s = 14 + Math.random() * 26;
    h += `<i style="--dx:${Math.cos(a) * r}px;--dy:${Math.sin(a) * r * .75}px;width:${s}px;height:${s}px;background:${COL[i % 6]};border-radius:${i % 3 ? '50%' : '6px'}"></i>`;
  }
  $('#conf').innerHTML = h;
}

// タイムライン（秒）
const SC = [[0, 4], [4, 10], [10, 16], [16, 21.5], [21.5, 26.5], [26.5, 31]];
const scenes = ['s1', 's2', 's3', 's4', 's5', 's6'].map(i => document.getElementById(i));
const stage = $('#stage'), ta = $('#ta'), D = 30;
let t0 = 0, raf = 0;


// ---- BGM（ブラウザ内で合成。音声ファイル不要）----
let AC, master, bus, comp, nbuf, muted = false;
const hz = m => 440 * 2 ** ((m - 69) / 12);
function initAudio() {
  if (AC) return;
  const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
  AC = new C();
  comp = AC.createDynamicsCompressor(); bus = AC.createGain(); bus.gain.value = muted ? 0 : 1;
  comp.connect(bus); bus.connect(AC.destination);
  nbuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
  const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function note(f, t, dur, type, vol) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .05);
}
function kick(t) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(42, t + .12);
  g.gain.setValueAtTime(.7, t); g.gain.exponentialRampToValueAtTime(.001, t + .3);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + .35);
}
function noise(t, ftype, freq, vol, dur) {
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = nbuf; f.type = ftype; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + .02);
}
function music(b0) {
  const CH = [[60, 64, 67], [59, 62, 67], [57, 60, 64], [57, 60, 65]], RT = [48, 43, 45, 41];
  const LD = [[76, 79, 81, 79, 76, 72, 74, 76], [74, 79, 83, 79, 74, 71, 74, 79], [72, 76, 81, 76, 72, 69, 72, 76], [72, 77, 81, 77, 72, 69, 72, 77]];
  for (let bar = 0; bar < 14; bar++) {          // 120BPM: 1小節 = 2秒
    const c = bar % 4, t = b0 + bar * 2;
    CH[c].forEach(m => note(hz(m), t, 1.9, 'sine', .05));
    for (let i = 0; i < 8; i++) {
      const tt = t + i * .25;
      note(hz(CH[c][[0, 1, 2, 1, 0, 1, 2, 1][i]] + 12), tt, .3, 'triangle', .07);
      if (bar >= 2) { note(hz(RT[c] + (i % 2 ? 12 : 0)), tt, .22, 'triangle', .2); if (i % 2) noise(tt, 'highpass', 7000, .05, .04); }
      if (bar >= 4) note(hz(LD[c][i]), tt, .22, 'square', .035);
    }
    if (bar >= 2) for (let k = 0; k < 4; k++) kick(t + k * .5);
    if (bar >= 4) { noise(t + .5, 'bandpass', 1500, .25, .12); noise(t + 1.5, 'bandpass', 1500, .25, .12); }
  }
  const te = b0 + 28;                            // フィニッシュ
  [48, 52, 55].forEach(m => note(hz(m), te, 2, 'triangle', .12));
  [72, 76, 79, 84].forEach(m => note(hz(m), te, 2, 'sine', .06));
  kick(te); noise(te, 'highpass', 4000, .2, .6);
  [.15, 4.05, 10.05, 16.05, 21.55, 26.55].forEach(x => [84, 88, 91, 96].forEach((m, i) => note(hz(m), b0 + x + i * .06, .5, 'sine', .07)));
  [7.9, 10.5, 11.6, 12.7, 13.8, 17.3, 18.5, 19.7, 21.9, 23.3].forEach(x => { note(hz(91), b0 + x, .25, 'sine', .09); note(hz(96), b0 + x + .07, .25, 'sine', .09); });
}
function playAudio() {
  if (!AC) return 0;
  AC.resume();
  if (master) { master.gain.cancelScheduledValues(0); master.disconnect(); }
  master = AC.createGain(); master.gain.value = .8; master.connect(comp);
  const base = AC.currentTime + .12;
  master.gain.setValueAtTime(.8, base + 29); master.gain.linearRampToValueAtTime(0, base + 30.2);
  music(base);
  return 120;
}

function fit() { stage.style.transform = `scale(${Math.min(innerWidth / 1280, innerHeight / 720)})`; }
addEventListener('resize', fit); fit();

function start() {
  scenes.forEach(s => s.classList.remove('on'));
  void stage.offsetWidth;
  conf();
  $('#ov').hidden = true;
  let lag = 0;
  try { initAudio(); lag = playAudio(); } catch (e) { console.warn(e); }
  t0 = performance.now() + lag;
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(tick);
}
function tick(now) {
  const t = (now - t0) / 1000;
  scenes.forEach((s, i) => s.classList.toggle('on', t >= SC[i][0] && t < SC[i][1]));
  // 入力アニメーション（シーン2）
  const k = Math.floor((t - 4.9) * 9);
  ta.textContent = (t < 4.9 || t > 7.6) ? '' : POST.slice(0, Math.min(POST.length, k)) + (k < POST.length ? '▏' : '');
  if (t > 7.4 && t < 7.9) $('#pb').style.transform = 'scale(.9)'; else $('#pb').style.transform = '';
  $('#bar').style.width = Math.min(100, t / D * 100) + '%';
  if (t >= D) {
    if (master) master.gain.cancelScheduledValues(0), master.gain.value = 0;
    $('#ov').hidden = false;
    $('#ov').style.background = '#1b1b3acc';
    $('#ov h1').textContent = 'おしまい';
    $('#play').textContent = '↻ もう一度';
    return;
  }
  raf = requestAnimationFrame(tick);
}
$('#play').onclick = start;
$('#mu').onclick = () => { muted = !muted; if (bus) bus.gain.value = muted ? 0 : 1; $('#mu').textContent = muted ? 'BGM OFF' : 'BGM ON'; };
$('#fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
addEventListener('keydown', e => { if (e.code === 'Space' && !$('#ov').hidden) { e.preventDefault(); start(); } });
</script>
</body>
</html>
