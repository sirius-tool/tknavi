<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>たちこくナビ 45秒PV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--a:#5ee7ff;--b:#ff6bd6;--c:#ffd36b;--fg:#e9edff;--mut:#9aa5d4;--bg:#060a1e;--bd:rgba(255,255,255,.15);--card:rgba(255,255,255,.07)}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%;background:#02040f;overflow:hidden;font-family:'Zen Maru Gothic',sans-serif}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;margin:-360px 0 0 -640px;background:var(--bg);color:var(--fg);overflow:hidden;font-weight:500}
.au{position:absolute;inset:-20%;background:radial-gradient(35% 35% at 20% 25%,#5ee7ff4d,transparent),radial-gradient(35% 35% at 80% 70%,#ff6bd642,transparent);animation:au 20s ease-in-out infinite alternate}
@keyframes au{to{transform:rotate(25deg) scale(1.2)}}
.gr{position:absolute;inset:0;background:linear-gradient(#ffffff09 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,#ffffff09 1px,transparent 1px) 0 0/48px 48px;-webkit-mask:radial-gradient(70% 70% at 50% 50%,#000,transparent);mask:radial-gradient(70% 70% at 50% 50%,#000,transparent)}
.sc{position:absolute;inset:0;opacity:0;transition:opacity .5s}
.sc.on{opacity:1}
.sc.on .a{animation:up .7s cubic-bezier(.2,.9,.3,1.15) var(--d,0s) both}
.sc.on .pop{animation:pop .8s cubic-bezier(.3,1.6,.5,1) var(--d,0s) both}
@keyframes up{from{opacity:0;transform:translateY(46px) scale(.96)}}
@keyframes pop{from{opacity:0;transform:scale(.2) rotate(-30deg)}}
.cap{position:absolute;left:96px;top:200px;width:540px}
.cap small{display:block;font-size:26px;font-weight:700;color:var(--mut);margin-bottom:10px}
.cap h2{font-size:62px;line-height:1.3;font-weight:900}
.hl,.shim{background:linear-gradient(100deg,var(--a),var(--b),var(--c),var(--a));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite}
@keyframes sh{to{background-position:-300% 0}}
.mock{position:absolute;left:690px;top:70px;width:510px}
.card{position:relative;background:var(--card);border:1px solid var(--bd);border-top:4px solid hsl(var(--h,190) 85% 58%);border-radius:22px;padding:16px 22px;backdrop-filter:blur(14px);margin-bottom:14px}
.card h3{font-size:25px;line-height:1.4;font-weight:900;margin:4px 0}
.card p{color:var(--mut);font-size:18px}
.badge{display:inline-block;background:hsl(var(--h,190) 85% 58%);color:#000;font-weight:900;border-radius:99px;padding:1px 14px;font-size:15px}
.btn{display:inline-block;margin-top:8px;background:linear-gradient(90deg,var(--a),var(--b));color:#fff;border-radius:12px;padding:7px 20px;font-weight:700;font-size:17px}
.pin{box-shadow:0 0 0 1px var(--c),0 10px 40px #ffd36b33}
.tabs{position:relative;display:flex;padding:5px;background:var(--card);border:1px solid var(--bd);border-radius:99px;margin-bottom:16px}
.tabs b{flex:1;text-align:center;padding:8px 0;font-size:17px;font-weight:700;position:relative;z-index:1;white-space:nowrap}
.tabs i{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/4);border-radius:99px;background:linear-gradient(90deg,var(--a),var(--b));box-shadow:0 4px 18px #ff6bd666;transform:translateX(calc(var(--k)*100%))}
.sc.on .tabs i{animation:tabm .5s cubic-bezier(.3,1.4,.5,1) .5s backwards}
.sc.on .st0 i{animation:none}
@keyframes tabm{from{transform:translateX(calc((var(--k) - 1)*100%))}}
.stats{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.ring{position:relative;width:92px;height:92px;flex:none}
.ring svg{width:92px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.ring .t{stroke:var(--bd)}
.ring .v{stroke:var(--b);stroke-dasharray:163.4;stroke-dashoffset:163.4}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:20px}
.st{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:8px 12px;text-align:center}
.st b{display:block;font-size:34px;line-height:1.2;color:var(--a)}
.st small{color:var(--mut);font-size:14px}
.r2{display:flex;align-items:center;gap:10px}
.cd{margin-left:auto;font-weight:900;font-size:28px}
.hot .cd{color:var(--b)}
.sc.on .hot.a{animation:up .7s cubic-bezier(.2,.9,.3,1.15) var(--d) both,pl 1.6s ease 2s infinite}
@keyframes pl{50%{box-shadow:0 0 0 8px #ff6bd640}}
.bar{height:6px;border-radius:9px;background:var(--bd);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,var(--a),var(--b))}
.sc.on .bar i{animation:gw 1.3s ease .8s both}
@keyframes gw{from{width:0}}
.ck{display:flex;gap:10px;align-items:center;font-weight:700;font-size:17px;margin-top:8px}
.cb{width:24px;height:24px;border:2px solid var(--bd);border-radius:7px;display:grid;place-items:center;color:#001;font-size:16px;font-style:normal}
.cb::after{content:"✓";opacity:0}
.sc.on .cb{animation:chk .3s ease var(--d) both}
.sc.on .cb::after{animation:fin .01s linear var(--d) both}
@keyframes chk{to{background:var(--a);border-color:var(--a)}}
@keyframes fin{to{opacity:1}}
.cdn{display:flex;gap:14px}
.cdc{flex:1;text-align:center;padding:18px 10px}
.cdc small{color:var(--mut);font-size:18px;font-weight:700}
.num{font-size:26px;font-weight:900}
.num b{font-size:84px;line-height:1.1;background:linear-gradient(100deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;margin:0 4px}
.tkw{overflow:hidden;border-block:1px dashed var(--bd);margin-top:6px;-webkit-mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.tk{display:flex;width:max-content;gap:50px;padding:8px 0;color:var(--mut);font-size:18px;animation:mq 12s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
.dkp{background:#eef2ff;color:#151a40;border:1px solid #151a4026;border-top:4px solid var(--a)}
.sc.on .dkp.a{animation:up .7s cubic-bezier(.2,.9,.3,1.15) .3s both,dark .5s ease 2.6s both}
@keyframes dark{to{background:#0d1330;color:#e9edff;border-color:var(--bd);border-top-color:var(--b)}}
.sq{display:flex;align-items:center;gap:10px;background:rgba(127,130,200,.2);border-radius:99px;padding:10px 20px;font-size:20px}
.typ{overflow:hidden;white-space:nowrap;width:2.1em}
.sc.on .typ{animation:typ .6s steps(2) 1s backwards}
@keyframes typ{from{width:0}}
.th{margin-left:auto;font-size:26px}
.sc.on .th{animation:tp .5s ease 2.5s}
@keyframes tp{50%{transform:scale(1.5) rotate(180deg)}}
.mc{background:rgba(127,130,200,.16);border-radius:16px;padding:12px 18px;margin-top:12px;font-size:20px;font-weight:700;border-top:3px solid hsl(var(--h) 85% 58%)}
.mc small{display:block;font-weight:500;font-size:16px;opacity:.7}
.center,.h1c{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.shim{font-size:128px;font-weight:900;line-height:1.15}
.tw{font-size:32px;color:var(--mut);margin-top:12px;min-height:1.6em}
.tw::after{content:"▍";color:var(--a);animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.splash{position:absolute;inset:0;background:var(--bg);display:grid;place-content:center;justify-items:center;gap:14px;z-index:3}
.sc.on .splash{animation:sout .9s cubic-bezier(.7,0,.2,1) 2.7s both}
@keyframes sout{to{transform:translateY(-100%);opacity:0}}
.splash b{font-size:40px;letter-spacing:.2em;color:var(--a)}
.splash small{font-size:22px;color:var(--mut)}
.cpw svg{width:150px;color:var(--fg);animation:sp 2.4s ease-in-out infinite}
.nb{fill:var(--b)}.na{fill:var(--a)}
@keyframes sp{50%{transform:rotate(200deg) scale(1.15)}}
#conf i{position:absolute;left:50%;top:46%;margin:-12px}
.sc.on #conf i{animation:burst 1.5s cubic-bezier(.1,.8,.3,1) 3.1s both}
@keyframes burst{from{transform:translate(0,0) scale(0)}to{transform:translate(var(--dx),var(--dy)) scale(1)}}
.s7 h2{font-size:84px;font-weight:900;line-height:1.25}
.s7 .cpw svg{width:110px;margin-bottom:10px}
.go{background:linear-gradient(90deg,var(--a),var(--b));color:#fff;font-weight:900;font-size:32px;border-radius:99px;padding:12px 46px;margin-top:26px;box-shadow:0 14px 40px #ff6bd655}
.sib{display:flex;gap:16px;justify-content:center;margin-top:28px}
.sb{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:10px 22px;font-size:16px;font-weight:700;color:var(--mut);text-align:left}
.sb b{display:block;font-size:22px;font-weight:900;color:var(--c)}
.s7 .sub{margin-top:22px;font-size:19px;color:var(--mut)}
#bar{position:absolute;left:0;bottom:0;height:6px;width:0;background:linear-gradient(90deg,var(--a),var(--b),var(--c));z-index:5}
#ov{position:absolute;inset:0;z-index:10;background:var(--bg);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center}
#ov h1{font-size:64px;font-weight:900;color:var(--a);letter-spacing:.1em}
#ov p{color:var(--mut);font-size:22px;font-weight:700}
#play{border:0;cursor:pointer;background:linear-gradient(90deg,var(--a),var(--b));color:#fff;font:900 30px 'Zen Maru Gothic';border-radius:99px;padding:14px 56px}
#fs,#mu{position:fixed;right:12px;top:12px;z-index:20;border:0;background:#ffffff30;color:#fff;border-radius:99px;padding:6px 16px;font:700 13px 'Zen Maru Gothic';cursor:pointer}
#mu{right:94px}
</style>
</head>
<body>
<button id="mu">BGM ON</button><button id="fs">全画面</button>
<div id="stage">
  <div class="au"></div><div class="gr"></div>
  <div class="sc" id="s1"><div class="h1c"><div class="a" style="--d:2.9s"><h1 class="shim">たちこくナビ</h1></div><p class="tw" id="tw"></p><div id="conf"></div></div>
    <div class="splash"><div class="cpw"></div><b>たちこくナビ</b><small id="spn">0%</small></div></div>
  <div class="sc" id="s2"><div class="cap a"><small>考査の範囲は</small><h2><span class="hl">範囲表</span>を<br>ダウンロード。</h2></div><div class="mock" id="m2"></div></div>
  <div class="sc" id="s3"><div class="cap a"><small>終わったらチェックで</small><h2><span class="hl">課題</span>の期限と<br>達成率がひと目。</h2></div><div class="mock" id="m3" style="top:50px"></div></div>
  <div class="sc" id="s4"><div class="cap a"><small>大事な連絡は</small><h2><span class="hl">お知らせ</span>を<br>ピン留め。</h2></div><div class="mock" id="m4"></div></div>
  <div class="sc" id="s5"><div class="cap a"><small>考査や模試まで</small><h2><span class="hl">日程</span>を<br>カウントダウン。</h2></div><div class="mock" id="m5" style="top:110px"></div></div>
  <div class="sc" id="s6"><div class="cap a"><small>探しやすく、見やすく</small><h2><span class="hl">検索</span>も<br><span class="hl">ダークモード</span>も。</h2></div><div class="mock" id="m6" style="top:140px"></div></div>
  <div class="sc s7" id="s7"><div class="center">
    <div class="cpw a" style="--d:.1s"></div>
    <h2 class="shim a" style="--d:.3s">さあ、ナビを開こう。</h2>
    <div class="go pop" style="--d:1s" id="url"></div>
    <div class="sib a" style="--d:1.7s"><div class="sb"><b>STUDIX</b>学習管理アプリ</div><div class="sb"><b>たちこくナビneo</b>考査の練習問題</div><div class="sb"><b>たちこくコミュニティ</b>自由なコメントはこちら</div></div>
    <div class="sub a" style="--d:2.5s">STUDIXとナビneoはオープンソース。安心して使えます。</div>
  </div></div>
  
<div id="bar"></div>
  <div id="ov"><h1>たちこくナビ</h1><p>45秒でわかる、学校のことぜんぶここに（音が出ます）</p><button id="play">▶ 再生</button></div>
</div>

<script>
// ▼ 最後の画面に表示するURL（実際のサイトのURLに書き換えてください）
const SITE_URL = 'sirius-tool.github.io/tknavi';

const $ = s => document.querySelector(s);
const COL = ['#5ee7ff', '#ff6bd6', '#ffd36b', '#8b9cff', '#6bffb5', '#ff9a6b'];
const tg = (k, t) => `<span class="tag ${k}">${t}</span>`;
const NEW = tg('fresh', '新規'), OK = tg('ok', '✓ 認証済み'), PIN = tg('pn', '固定中');
const card = (n, ci, body, tags = '', tm = 'たった今', d = 0, cls = '') =>
  `<div class="c a ${cls}" style="--d:${d}s"><div class="av" style="background:${COL[ci]}">${n[0]}</div><div class="bd"><div class="meta"><b>${n}</b>${tags}<time>${tm}</time></div><p>${body}</p></div></div>`;
const POST = '今日の部活おつかれ！みんなで打ち上げ行こうよ';

$('#url').textContent = SITE_URL;
const CP = '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="50" cy="50" r="38" fill="none" stroke="currentColor" stroke-dasharray="2 6" opacity=".5"/><g><path class="nb" d="M50 10L62 50H38Z"/><path class="na" d="M50 90L62 50H38Z"/></g><circle cx="50" cy="50" r="5" fill="currentColor"/></svg>';
document.querySelectorAll('.cpw').forEach(e => e.innerHTML = CP);
const PH = 'テスト勉強、ここから出発';
const tabs = k => `<div class="tabs a${k ? '' : ' st0'}"><i style="--k:${k}"></i><b>📄 範囲表</b><b>📝 課題</b><b>📢 お知らせ</b><b>📅 日程</b></div>`;
const crd = (h, badge, title, p, d, x = '', cls = '') => `<div class="card a ${cls}" style="--h:${h};--d:${d}s"><span class="badge">${badge}</span><h3>${title}</h3><p>${p}</p>${x}</div>`;
const dl = '<span class="btn">PDFをダウンロード</span>';
$('#m2').innerHTML = tabs(0) + crd(190, '2学期期末考査', '範囲表（数学・英語）', '試験日 12/8（月）〜　備考：教科書 p.30〜58', .7, dl) + crd(330, '2学期期末考査', '範囲表（国語・理科）', '試験日 12/8（月）〜　備考：ワーク第3章まで', 1.5, dl);
const task = (h, sub, t, due, cd, w, ck, d, cls) => `<div class="card a ${cls}" style="--h:${h};--d:${d}s"><div class="r2"><span class="badge">${sub}</span><h3>${t}</h3><span class="cd">${cd}</span></div><div class="bar" style="--w:${w}%"><i></i></div><label class="ck"><i class="cb" style="--d:${ck}s"></i>完了にする（期限 ${due}）</label></div>`;
$('#m3').innerHTML = tabs(1) +
  `<div class="stats a" style="--d:.4s"><div class="ring"><svg viewBox="0 0 60 60"><circle class="t" cx="30" cy="30" r="26"/><circle class="v" id="rv" cx="30" cy="30" r="26"/></svg><span id="rp">0%</span></div><div class="st"><b>3</b><small>未完了の課題</small></div><div class="st"><b>2</b><small>7日以内の期限</small></div></div>` +
  task(330, '数学', '数学プリント', '12/1', 'あと1日', 90, 4.4, 1.2, 'hot') + task(190, '英語', '英語ワーク', '12/3', 'あと3日', 60, 3, 1.9, '');
$('#m4').innerHTML = tabs(2) + crd(45, '📌 ピン留め', '学期末の行事予定が変わります', '12/10の行事が一日ずれます。', .7, '', 'pin') + crd(190, 'ニュース', 'ナビがアップデート', 'v4.2.0（11/27）になりました。', 1.5) + crd(330, 'お知らせ', '清掃当番の変更', '来週から新しい班です。', 2.3);
const TK = '📢 学期末の行事予定が変わります　・　📝 数学プリントは12/1まで　・　📄 範囲表を公開しました　・　';
$('#m5').innerHTML = tabs(3) + `<div class="cdn"><div class="card cdc a" style="--h:190;--d:.6s"><small>考査まで</small><div class="num">あと<b>10</b>日</div></div><div class="card cdc a" style="--h:330;--d:1.2s"><small>模試まで</small><div class="num">あと<b>24</b>日</div></div></div><div class="tkw a" style="--d:1.8s"><div class="tk"><span>${TK}</span><span>${TK}</span></div></div>`;
$('#m6').innerHTML = `<div class="card dkp a"><div class="sq">🔍 <span class="typ">数学</span><span class="th">🌓</span></div><div class="mc" style="--h:190">数学プリント<small>課題・期限 12/1</small></div><div class="mc" style="--h:330">範囲表（数学・英語）<small>2学期期末考査</small></div></div>`;

// 紙吹雪
function conf() {
  let h = '';
  for (let i = 0; i < 28; i++) {
    const a = Math.random() * 6.283, r = 260 + Math.random() * 340, s = 14 + Math.random() * 26;
    h += `<i style="--dx:${Math.cos(a) * r}px;--dy:${Math.sin(a) * r * .75}px;width:${s}px;height:${s}px;background:${COL[i % 6]};border-radius:${i % 3 ? '50%' : '6px'}"></i>`;
  }
  $('#conf').innerHTML = h;
}

// タイムライン（秒）
const SC = [[0, 5], [5, 12], [12, 20], [20, 26], [26, 32], [32, 38], [38, 46]];
const scenes = ['s1', 's2', 's3', 's4', 's5', 's6', 's7'].map(i => document.getElementById(i));
const stage = $('#stage'), D = 45;
let t0 = 0, raf = 0;


// ---- BGM（ブラウザ内で合成。音声ファイル不要）----
let AC, master, bus, comp, nbuf, muted = false;
const hz = m => 440 * 2 ** ((m - 69) / 12);
function initAudio() {
  if (AC) return;
  const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
  AC = new C();
  comp = AC.createDynamicsCompressor(); bus = AC.createGain(); bus.gain.value = muted ? 0 : 1;
  comp.connect(bus); bus.connect(AC.destination);
  nbuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
  const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
let dIn;
function note(f, t, dur, type, vol, o) {
  o = o || {};
  const os = AC.createOscillator(), g = AC.createGain(); let n = os;
  os.type = type; os.frequency.value = f; if (o.det) os.detune.value = o.det;
  if (o.lp) { const l = AC.createBiquadFilter(); l.type = 'lowpass'; l.frequency.value = o.lp; os.connect(l); n = l; }
  g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(vol, t + (o.atk || .01)); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  n.connect(g); g.connect(master); if (o.fx) g.connect(dIn);
  os.start(t); os.stop(t + dur + .05);
}
function kick(t) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(42, t + .12);
  g.gain.setValueAtTime(.7, t); g.gain.exponentialRampToValueAtTime(.001, t + .3);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + .35);
}
function noise(t, ftype, freq, vol, dur) {
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = nbuf; f.type = ftype; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + .02);
}
function sweep(t, dur) {                       // ライザー（盛り上げ）
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = nbuf; s.loop = true; f.type = 'bandpass'; f.Q.value = 2;
  f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(9000, t + dur);
  g.gain.setValueAtTime(.001, t); g.gain.linearRampToValueAtTime(.22, t + dur); g.gain.linearRampToValueAtTime(0, t + dur + .05);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + .1);
}
const CH = [[57, 60, 64], [57, 60, 65], [55, 60, 64], [55, 59, 62]], RT = [45, 41, 48, 43];
const AR = [0, 1, 2, 1, 2, 1, 0, 1, 2, 1, 2, 1, 0, 2, 1, 2];
const LD = [[76, 79, 81, 79, 76, 72, 74, 76], [77, 81, 84, 81, 77, 72, 74, 77], [76, 79, 84, 79, 76, 72, 74, 79], [74, 79, 83, 79, 74, 71, 74, 79]];
let sched;
function scheduleBar(b0, bar) {                // 1小節（2秒）ぶんを予約
  const c = bar % 4, t = b0 + bar * 2;
  CH[c].forEach(m => [-8, 8].forEach(d => note(hz(m - 12), t, 2, 'sawtooth', .035, { lp: 900, det: d, atk: .3 })));
  for (let i = 0; i < 16; i++) {
    const tt = t + i * .125, rel = bar * 2 + i * .125, e = i % 2 === 0;
    note(hz(CH[c][AR[i]] + 12), tt, .22, 'triangle', .07, { fx: 1 });
    if (rel >= 3 && e) note(hz(RT[c]), tt, .22, 'sawtooth', .16, { lp: 500 });
    if (rel >= 4 && e) noise(tt, 'highpass', 8000, .03, .03);
    if (rel >= 3 && i % 4 === 2) noise(tt, 'highpass', 6000, .05, .12);
    if (rel >= 12 && e) note(hz(LD[c][i / 2]), tt, .2, 'square', .03, { fx: 1, lp: 3000 });
    if (rel >= 38 && e) note(hz(LD[c][i / 2] + 12), tt, .2, 'triangle', .05, { fx: 1 });
  }
  for (let k = 0; k < 4; k++) if (bar * 2 + k * .5 >= 3) kick(t + k * .5);
  if (bar >= 4) { noise(t + .5, 'bandpass', 1500, .25, .12); noise(t + 1.5, 'bandpass', 1500, .25, .12); }
}
function music(b0) {                           // 120BPM / Aマイナー（Am-F-C-G）のネオン・シンセ
  clearInterval(sched);
  [1.5, 10.5, 18.5, 24.5, 30.5, 36.5].forEach(x => sweep(b0 + x, 1.5));
  [3, 12, 20, 26, 32, 38].forEach(x => noise(b0 + x, 'highpass', 3000, .18, .9));
  const te = b0 + 42;                          // フィニッシュ（Am）
  [45, 57, 60, 64, 69].forEach(m => note(hz(m), te, 3, 'triangle', .1, { fx: 1 }));
  kick(te); noise(te, 'highpass', 3000, .22, 1.2);
  [5.05, 12.05, 20.05, 26.05, 32.05, 38.05].forEach(x => [81, 84, 88, 93].forEach((m, i) => note(hz(m), b0 + x + i * .07, .6, 'sine', .07, { fx: 1 })));
  [5.7, 6.5, 13.2, 13.9, 15, 16.4, 20.7, 21.5, 22.3, 26.6, 27.2, 33, 34.6, 39].forEach(x => { note(hz(88), b0 + x, .2, 'sine', .09, { fx: 1 }); note(hz(95), b0 + x + .07, .25, 'sine', .09, { fx: 1 }); });
  let bar = 0;                                 // 先読みしながら少しずつ予約（負荷を分散）
  const pump = () => { while (bar < 21 && b0 + bar * 2 < AC.currentTime + 6) scheduleBar(b0, bar++); if (bar >= 21) clearInterval(sched); };
  pump(); sched = setInterval(pump, 400);
}
function playAudio() {
  if (!AC) return 0;
  AC.resume();
  if (master) { master.gain.cancelScheduledValues(0); master.disconnect(); }
  master = AC.createGain(); master.gain.value = .8; master.connect(comp);
  dIn = AC.createGain();                       // エコー（ディレイ）
  const dly = AC.createDelay(1), fb = AC.createGain(), wet = AC.createGain();
  dly.delayTime.value = .375; fb.gain.value = .38; wet.gain.value = .45;
  dIn.connect(dly); dly.connect(fb); fb.connect(dly); dly.connect(wet); wet.connect(master);
  const base = AC.currentTime + .12;
  master.gain.setValueAtTime(.8, base + 43.5); master.gain.linearRampToValueAtTime(0, base + 45.2);
  music(base);
  return 120;
}

function fit() { stage.style.transform = `scale(${Math.min(innerWidth / 1280, innerHeight / 720)})`; }
addEventListener('resize', fit); fit();

async function start() {
  scenes.forEach(s => s.classList.remove('on'));
  void stage.offsetWidth;
  conf();
  $('#ov').hidden = true;
  let lag = 0;
  try {
    initAudio();
    if (AC) await Promise.race([AC.resume(), new Promise(r => setTimeout(r, 800))]);
    lag = playAudio();
    $('#mu').textContent = muted ? 'BGM OFF' : (AC && AC.state === 'running' ? 'BGM ON' : 'BGM：音が出ない場合はここを押す');
  } catch (e) { console.error(e); $('#mu').textContent = 'BGMエラー（' + (e.message || e) + '）'; }
  t0 = performance.now() + lag;
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(tick);
}
function tick(now) {
  const t = (now - t0) / 1000;
  scenes.forEach((s, i) => s.classList.toggle('on', t >= SC[i][0] && t < SC[i][1]));
  $('#spn').textContent = Math.min(100, Math.floor(t / 2.5 * 100)) + '%';
  const k = Math.floor((t - 3.4) * 10);
  $('#tw').textContent = t < 3.4 ? '' : PH.slice(0, Math.min(PH.length, k));
  const q = Math.max(0, Math.min(1, (t - 14.8) / 2.4));
  $('#rv').style.strokeDashoffset = 163.4 * (1 - .67 * q);
  $('#rp').textContent = Math.round(67 * q) + '%';
  $('#bar').style.width = Math.min(100, t / D * 100) + '%';
  if (t >= D) {
    clearInterval(sched);
    if (master) master.gain.cancelScheduledValues(0), master.gain.value = 0;
    $('#ov').hidden = false;
    $('#ov').style.background = '#060a1ecc';
    $('#ov h1').textContent = 'おしまい';
    $('#play').textContent = '↻ もう一度';
    return;
  }
  raf = requestAnimationFrame(tick);
}
$('#play').onclick = start;
$('#mu').onclick = () => { if (AC && AC.state !== 'running') { AC.resume(); $('#mu').textContent = 'BGM ON'; return; } muted = !muted; if (bus) bus.gain.value = muted ? 0 : 1; $('#mu').textContent = muted ? 'BGM OFF' : 'BGM ON'; };
$('#fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
addEventListener('keydown', e => { if (e.code === 'Space' && !$('#ov').hidden) { e.preventDefault(); start(); } });
</script>
